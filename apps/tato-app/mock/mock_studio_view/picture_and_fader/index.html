<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picture and fader</title>
    <style>
      :root { color-scheme: dark; font: 12px/1.4 system-ui, sans-serif; --header-row-inset: 0px; --header-row-height: 30px; }
      body { margin: 0; height: 100vh; display: grid; grid-template-rows: var(--header-row-height) 1fr auto; background: #1d1d20; color: #f0f0f2; }
      #header-row { display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 0 6px 0 var(--header-row-inset); background: #202023; border-bottom: 1px solid #111113; }
      #picture-fit { height: 22px; border: 0; border-radius: 4px; padding: 0 8px; background: #2b2b2f; color: #f0f0f2; font: inherit; }
      #picture-fit:hover { background: #34343a; }
      #picture-area { position: relative; min-height: 0; }
      #picture { width: 100%; height: 100%; object-fit: contain; display: block; }
      #picture[data-picture-fit="cover"] { object-fit: cover; }
      #picture-status { position: absolute; top: 8px; left: 12px; color: #9a9aa3; }
      #fader-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid #111113; }
      #fader { flex: 1; }
      #fader-answer { color: #9a9aa3; }
    </style>
  </head>
  <body>
    <div id="header-row" data-fixture-view-header-row="">
      <button id="picture-fit" type="button" data-fixture-view-picture-fit="">Fit</button>
    </div>
    <div id="picture-area">
      <canvas id="picture" width="640" height="360"></canvas>
      <div id="picture-status" data-fixture-view-picture-status="">Connecting to Tato Studio</div>
    </div>
    <div id="fader-row">
      <label for="fader">fader</label>
      <input id="fader" type="range" min="0" max="1" step="0.01" value="0.5" />
      <output id="fader-value" for="fader">0.50</output>
      <span id="fader-answer" data-fixture-view-fader-answer=""></span>
    </div>
    <script type="module" src="./picture_and_fader_view.ts"></script>
  </body>
</html>
