[package]
name = "tatolab-runtime-viewer-frame-import"
description = "Tato Studio's Node addon that reads a runtime viewer's channel and imports each Image frame for Electron's sharedTexture"
version = "0.0.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
napi = { version = "3.16.1", default-features = false, features = ["napi8"] }
napi-derive = "3.7.0"
parking_lot = "0.12"
rmp-serde = "1.3"
serde_json = "1"
streamlib-gpu-frame-import-client = { git = "https://github.com/tatolab/streamlib", rev = "50877dcef3600dd35e55388d3b1732a9a37692bd" }
streamlib-ipc-types = { git = "https://github.com/tatolab/streamlib", rev = "50877dcef3600dd35e55388d3b1732a9a37692bd" }

[target.'cfg(target_os = "linux")'.dependencies]
streamlib-surface-client = { git = "https://github.com/tatolab/streamlib", rev = "50877dcef3600dd35e55388d3b1732a9a37692bd" }
streamlib-consumer-rhi = { git = "https://github.com/tatolab/streamlib", rev = "50877dcef3600dd35e55388d3b1732a9a37692bd" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-io-surface = "0.3"

[build-dependencies]
napi-build = "2.6.0"
