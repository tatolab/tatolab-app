<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232a5bff'/%3E%3Cpath d='M19 22h26M32 22v23' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Tatolab</title>
    <script>
      (function () {
        var pinned = new URLSearchParams(location.search).get("theme");
        var media = matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          document.documentElement.dataset.theme =
            pinned === "light" || pinned === "dark" ? pinned : media.matches ? "dark" : "light";
        }
        apply();
        if (pinned !== "light" && pinned !== "dark") media.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
