<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picture and fader</title>
    <style>
      :root { color-scheme: dark; font: 12px/1.4 system-ui, sans-serif; }
      body { margin: 0; height: 100vh; display: grid; grid-template-rows: 1fr auto; background: #111417; color: #c9d1d9; }
      #picture { width: 100%; height: 100%; object-fit: contain; display: block; min-height: 0; }
      #fader-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid #262c33; }
      #fader { flex: 1; }
      #fader-answer { color: #8b949e; }
      #picture-status { position: absolute; top: 8px; left: 12px; color: #8b949e; }
    </style>
  </head>
  <body>
    <div id="picture-status" data-fixture-view-picture-status="">Connecting to Tato Studio</div>
    <canvas id="picture" width="640" height="360"></canvas>
    <div id="fader-row">
      <label for="fader">fader</label>
      <input id="fader" type="range" min="0" max="1" step="0.01" value="0.5" />
      <output id="fader-value" for="fader">0.50</output>
      <span id="fader-answer" data-fixture-view-fader-answer=""></span>
    </div>
    <script type="module" src="./picture_and_fader_view.ts"></script>
  </body>
</html>
