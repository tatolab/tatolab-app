name: Pull request checks

# The merge gate: the lint and the app's type checks and tests on macOS and Linux, on every
# pull request. Hermetic only — no runtime, no signing, no streamlib checkout; building, signing and
# publishing stay in macos-app.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and the pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the pull request title is conventional
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PULL_REQUEST_TITLE" | npx commitlint

      - name: Lint
        run: npm run lint

      - name: Prove the machine-brake hook notes, stays silent and prompts where it should
        run: .claude/scripts/tests/machine-brake.test.sh

  macos:
    name: Test and lint (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Type-check and test the window and the main process
        run: |
          npm ci
          npm run build:service-management-addon
          npm run build
          npm test

  linux:
    name: Test and lint (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Type-check and test the window and the main process
        run: |
          npm ci
          npm run build
          npm test
