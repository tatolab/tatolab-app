name: Pull request checks

# The merge gate: the source gates and the app's type checks and tests on macOS and Linux, on every
# pull request. Hermetic only — no runtime, no signing, no streamlib checkout; building, signing and
# publishing stay in macos-app.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-gates:
    name: Source gates and the pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the pull request title is conventional
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-conventional-pr-title.sh "$PULL_REQUEST_TITLE"

      - name: Run every source gate
        run: scripts/check-all-source-gates.sh

      - name: Prove each source gate fails on a planted violation
        run: scripts/tests/source_gates_fail_on_a_violation.test.sh

      - name: Prove the machine-brake hook notes, stays silent and prompts where it should
        run: .claude/scripts/tests/machine-brake.test.sh

  macos:
    name: Test and lint (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Type-check and test the window and the main process
        run: |
          npm ci
          npm run build:service-management-addon
          npm run build
          npm run build:electron
          npm test

  linux:
    name: Test and lint (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Type-check and test the window and the main process
        run: |
          npm ci
          npm run build
          npm run build:electron
          npm test
