name: CI

# A pull request runs the checks that say the code is good: types, lint and the unit tests, which
# cover both platform modules on any OS. Nothing is built, packaged, signed or published here;
# that is release.yml's, on main.
on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types, lint and unit tests of every workspace
        run: npx turbo run typecheck lint test
