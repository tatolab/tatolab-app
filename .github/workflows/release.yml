name: Release

# Ships Tato Studio to the update feed at get.tatolab.com, which the installed apps check: every merge
# to main, and every streamlib release, whose release workflow dispatches this one with its version
# once its Linux runtime is on get.tatolab.com. A merge bundles the streamlib release get.tatolab.com
# serves as latest, and every release is versioned by
# apps/tato-app/scripts/plan_tatolab_app_release.mjs. macOS is built, signed with the Developer ID and notarized on
# a macos-26 runner; Linux on ubuntu-22.04. Everything the app publishes lives under app/, apart from
# streamlib's packages/, simple/, releases/, install.sh and latest: the files land under
# app/releases/<version>/ first, and the feed's manifests in app/ only once both platforms built, so
# an installed app never reads a manifest whose files are missing. Secrets come from the
# repository's Infisical sync. The release runs no tests; pull requests run them in ci.yml. A
# platform's files built once for an app version, streamlib release and commit are kept in the
# Actions cache and taken from it on a later run, and macOS's runtime unit, which streamlib does
# not publish, is kept per streamlib release, so a release over the same runtime does not build it again.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      streamlib_version:
        description: "The streamlib release to bundle, X.Y.Z (blank: the one get.tatolab.com serves as latest)"
        type: string
        default: ""
      publish:
        description: "Publish to get.tatolab.com and the GitHub release (unticked: build only)"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GET_TATOLAB_COM_BUCKET: get-tatolab-com
  GET_TATOLAB_COM_URL: https://get.tatolab.com

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      app_version: ${{ steps.plan.outputs.app_version }}
      streamlib_tag: ${{ steps.plan.outputs.streamlib_tag }}
      streamlib_version: ${{ steps.plan.outputs.streamlib_version }}
      linux_runtime_tarball_url: ${{ steps.plan.outputs.linux_runtime_tarball_url }}
      streamlib_release_contains_the_client_pin: ${{ steps.client-pin.outputs.streamlib_release_contains_the_client_pin }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/tato-app/scripts/plan_tatolab_app_release.mjs
            apps/tato-app/tatolab-runtime-client-pin.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: plan
        env:
          REQUESTED_STREAMLIB_VERSION: ${{ inputs.streamlib_version }}
        run: node apps/tato-app/scripts/plan_tatolab_app_release.mjs "$REQUESTED_STREAMLIB_VERSION"

      # The app's code calls the streamlib its client pin names, and the build refuses a runtime
      # older than that. A merge that moves the pin past every streamlib release builds and
      # publishes nothing; streamlib's next release dispatches this workflow with its version.
      - id: client-pin
        env:
          STREAMLIB_TAG: ${{ steps.plan.outputs.streamlib_tag }}
        run: |
          set -euo pipefail
          pinned_streamlib_commit="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).streamlib_commit)' apps/tato-app/tatolab-runtime-client-pin.json)"
          ancestry_directory="$RUNNER_TEMP/streamlib-ancestry"
          git init -q "$ancestry_directory"
          git -C "$ancestry_directory" fetch -q --filter=tree:0 https://github.com/tatolab/streamlib.git "refs/tags/$STREAMLIB_TAG"
          if git -C "$ancestry_directory" merge-base --is-ancestor "$pinned_streamlib_commit" FETCH_HEAD; then
            echo "streamlib_release_contains_the_client_pin=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::streamlib $STREAMLIB_TAG does not contain streamlib $pinned_streamlib_commit, which the app's runtime client is pinned to: nothing is built or published until a streamlib release carries it"
            echo "streamlib_release_contains_the_client_pin=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    name: Build, sign and notarize for macOS
    needs: plan
    if: needs.plan.outputs.streamlib_release_contains_the_client_pin == 'true'
    # Pinned, not macos-latest: the image decides the SDK, and the app's floor is macOS 26.0.
    runs-on: macos-26
    timeout-minutes: 240
    env:
      RELEASE_FILES_CACHE_KEY: tato-studio-release-files-macos-${{ needs.plan.outputs.app_version }}-${{ needs.plan.outputs.streamlib_version }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Take this release's macOS files built by an earlier run
        id: cached-release-files
        uses: actions/cache/restore@v5
        with:
          key: ${{ env.RELEASE_FILES_CACHE_KEY }}
          path: |
            apps/tato-app/build/Tato-Studio-${{ needs.plan.outputs.app_version }}-arm64.dmg
            apps/tato-app/build/Tato-Studio-${{ needs.plan.outputs.app_version }}-arm64-mac.zip
            apps/tato-app/build/latest-mac.yml

      # Its carried code is signed with the Developer ID, the one identity every build signs with.
      - name: Take the macOS runtime unit built for this streamlib release by an earlier run
        id: cached-macos-runtime-unit
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          key: tatolab-runtime-unit-macos-${{ needs.plan.outputs.streamlib_tag }}-${{ hashFiles('apps/tato-app/scripts/build-tatolab-runtime-unit.sh') }}
          path: ${{ runner.temp }}/tatolab-runtime-unit-macos

      - name: Every secret the macOS build reads is set
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_RUNTIME_PROVISIONING_PROFILE: ${{ secrets.APPLE_RUNTIME_PROVISIONING_PROFILE }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing_secrets=()
          for required_secret in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_RUNTIME_PROVISIONING_PROFILE APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!required_secret}" ] || missing_secrets+=("$required_secret")
          done
          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "::error::not set in the repository's secrets (Infisical sync): ${missing_secrets[*]}"
            exit 1
          fi

      # cmake and ninja build streamlib's bundled Vulkan loader; shaderc its shaders.
      - name: Install the build tools
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install shaderc cmake ninja

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cached-release-files.outputs.cache-hit != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        with:
          shared-key: tato-studio-release-macos
          workspaces: |
            apps/tato-app/build/streamlib -> target
            apps/tato-app/native/tatolab-runtime-viewer-frame-import -> target

      - uses: actions/setup-node@v5
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      # The Python the build resolves is streamlib's, cloned by the build step after this one, so no
      # file here can key the cache; the streamlib release it bundles does.
      - uses: astral-sh/setup-uv@v7
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        with:
          cache-dependency-glob: ""
          cache-suffix: ${{ needs.plan.outputs.streamlib_tag }}

      - name: Build Tato Studio.app, its .dmg and its update
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_RUNTIME_PROVISIONING_PROFILE: ${{ secrets.APPLE_RUNTIME_PROVISIONING_PROFILE }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          STREAMLIB_TAG: ${{ needs.plan.outputs.streamlib_tag }}
          APP_VERSION: ${{ needs.plan.outputs.app_version }}
          CACHED_MACOS_RUNTIME_UNIT: ${{ steps.cached-macos-runtime-unit.outputs.cache-hit == 'true' && format('{0}/tatolab-runtime-unit-macos', runner.temp) || '' }}
        run: |
          set -euo pipefail
          # notarytool reads the App Store Connect key from a file; it lives only as long as this step.
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          (umask 077 && printf "%s" "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH")
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          export APPLE_API_KEY_PATH
          runtime_unit_arguments=()
          [ -n "$CACHED_MACOS_RUNTIME_UNIT" ] && runtime_unit_arguments=(--runtime-unit "$CACHED_MACOS_RUNTIME_UNIT")
          apps/tato-app/scripts/build-tatolab-app.sh --streamlib-ref "$STREAMLIB_TAG" --app-version "$APP_VERSION" --release --notarize \
            ${runtime_unit_arguments[@]+"${runtime_unit_arguments[@]}"}

      # build-tatolab-runtime-unit.sh empties the unit's directory at the start of every build, so
      # the cache keeps a copy outside the streamlib checkout.
      - name: Keep the macOS runtime unit for this streamlib release
        if: steps.cached-release-files.outputs.cache-hit != 'true' && steps.cached-macos-runtime-unit.outputs.cache-hit != 'true'
        run: ditto apps/tato-app/build/streamlib/target/tatolab-runtime "$RUNNER_TEMP/tatolab-runtime-unit-macos"

      - if: steps.cached-release-files.outputs.cache-hit != 'true' && steps.cached-macos-runtime-unit.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.cached-macos-runtime-unit.outputs.cache-primary-key }}
          path: ${{ runner.temp }}/tatolab-runtime-unit-macos

      - if: steps.cached-release-files.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ env.RELEASE_FILES_CACHE_KEY }}
          path: |
            apps/tato-app/build/Tato-Studio-${{ needs.plan.outputs.app_version }}-arm64.dmg
            apps/tato-app/build/Tato-Studio-${{ needs.plan.outputs.app_version }}-arm64-mac.zip
            apps/tato-app/build/latest-mac.yml

      - uses: actions/upload-artifact@v6
        with:
          name: tato-studio-macos
          if-no-files-found: error
          path: |
            apps/tato-app/build/Tato-Studio-${{ needs.plan.outputs.app_version }}-arm64.dmg
            apps/tato-app/build/Tato-Studio-${{ needs.plan.outputs.app_version }}-arm64-mac.zip
            apps/tato-app/build/latest-mac.yml

  build-linux:
    name: Build for Linux
    needs: plan
    if: needs.plan.outputs.streamlib_release_contains_the_client_pin == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      RELEASE_FILES_CACHE_KEY: tato-studio-release-files-linux-${{ needs.plan.outputs.app_version }}-${{ needs.plan.outputs.streamlib_version }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Take this release's Linux files built by an earlier run
        id: cached-release-files
        uses: actions/cache/restore@v5
        with:
          key: ${{ env.RELEASE_FILES_CACHE_KEY }}
          path: |
            apps/tato-app/build/linux/Tato-Studio-${{ needs.plan.outputs.app_version }}-amd64.deb
            apps/tato-app/build/linux/Tato-Studio-${{ needs.plan.outputs.app_version }}-x86_64.AppImage
            apps/tato-app/build/linux/latest-linux.yml

      - name: Install the packaging tools
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev desktop-file-utils curl

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cached-release-files.outputs.cache-hit != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        with:
          shared-key: tato-studio-release-linux
          workspaces: apps/tato-app/native/tatolab-runtime-viewer-frame-import -> target

      - uses: actions/setup-node@v5
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        with:
          node-version: 22
          cache: npm

      # The runtime streamlib built at its glibc floor and serves from get.tatolab.com, which carries
      # the commit it was built from in streamlib-commit.
      - name: Take the release's Linux runtime unit
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        env:
          TARBALL_URL: ${{ needs.plan.outputs.linux_runtime_tarball_url }}
        run: |
          set -euo pipefail
          tarball_directory="$RUNNER_TEMP/linux-runtime-tarball"
          tarball_name="$(basename "$TARBALL_URL")"
          mkdir -p "$tarball_directory" "$RUNNER_TEMP/linux-runtime-unit"
          curl -fsSL -o "$tarball_directory/$tarball_name" "$TARBALL_URL"
          curl -fsSL -o "$tarball_directory/$tarball_name.sha256" "$TARBALL_URL.sha256"
          (cd "$tarball_directory" && sha256sum --check "$tarball_name.sha256")
          tar -C "$RUNNER_TEMP/linux-runtime-unit" -xzf "$tarball_directory/$tarball_name"

      - name: Build the .deb, the AppImage and their update
        if: steps.cached-release-files.outputs.cache-hit != 'true'
        env:
          STREAMLIB_TAG: ${{ needs.plan.outputs.streamlib_tag }}
          APP_VERSION: ${{ needs.plan.outputs.app_version }}
        run: >-
          apps/tato-app/scripts/build-tatolab-linux-app.sh --streamlib-ref "$STREAMLIB_TAG"
          --runtime-unit "$RUNNER_TEMP/linux-runtime-unit" --app-version "$APP_VERSION" --release

      - if: steps.cached-release-files.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ env.RELEASE_FILES_CACHE_KEY }}
          path: |
            apps/tato-app/build/linux/Tato-Studio-${{ needs.plan.outputs.app_version }}-amd64.deb
            apps/tato-app/build/linux/Tato-Studio-${{ needs.plan.outputs.app_version }}-x86_64.AppImage
            apps/tato-app/build/linux/latest-linux.yml

      - uses: actions/upload-artifact@v6
        with:
          name: tato-studio-linux
          if-no-files-found: error
          path: |
            apps/tato-app/build/linux/Tato-Studio-${{ needs.plan.outputs.app_version }}-amd64.deb
            apps/tato-app/build/linux/Tato-Studio-${{ needs.plan.outputs.app_version }}-x86_64.AppImage
            apps/tato-app/build/linux/latest-linux.yml

  publish:
    name: Publish to get.tatolab.com
    needs: [plan, build-macos, build-linux]
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.plan.outputs.app_version }}
      STREAMLIB_VERSION: ${{ needs.plan.outputs.streamlib_version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true

      - name: Every secret the publish reads is set
        env:
          CLOUDFLARE_R2_GET_TATOLAB_COM_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_GET_TATOLAB_COM_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_GET_TATOLAB_COM_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_GET_TATOLAB_COM_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing_secrets=()
          for required_secret in CLOUDFLARE_R2_GET_TATOLAB_COM_ACCESS_KEY_ID \
            CLOUDFLARE_R2_GET_TATOLAB_COM_SECRET_ACCESS_KEY CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!required_secret}" ] || missing_secrets+=("$required_secret")
          done
          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "::error::not set in the repository's secrets (Infisical sync): ${missing_secrets[*]}"
            exit 1
          fi

      # R2 through its S3 API. The checksum settings are the ones Cloudflare's R2 docs give for the
      # AWS CLI, whose default checksums R2 does not accept. Every key is under app/. The release's files go first and are
      # immutable; the manifests, which point at them, go last and are read fresh.
      - name: Serve the release from get.tatolab.com
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_GET_TATOLAB_COM_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_GET_TATOLAB_COM_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          r2_endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          put_object() {
            aws s3 cp --endpoint-url "$r2_endpoint" --only-show-errors \
              --content-type "$3" --cache-control "$4" "$1" "s3://$GET_TATOLAB_COM_BUCKET/$2"
          }
          immutable="public, max-age=31536000, immutable"
          put_object "release-files/Tato-Studio-$APP_VERSION-arm64.dmg" "app/releases/$APP_VERSION/Tato-Studio-$APP_VERSION-arm64.dmg" application/x-apple-diskimage "$immutable"
          put_object "release-files/Tato-Studio-$APP_VERSION-arm64-mac.zip" "app/releases/$APP_VERSION/Tato-Studio-$APP_VERSION-arm64-mac.zip" application/zip "$immutable"
          put_object "release-files/Tato-Studio-$APP_VERSION-amd64.deb" "app/releases/$APP_VERSION/Tato-Studio-$APP_VERSION-amd64.deb" application/vnd.debian.binary-package "$immutable"
          put_object "release-files/Tato-Studio-$APP_VERSION-x86_64.AppImage" "app/releases/$APP_VERSION/Tato-Studio-$APP_VERSION-x86_64.AppImage" application/octet-stream "$immutable"
          put_object release-files/latest-mac.yml app/latest-mac.yml "text/yaml; charset=utf-8" "no-cache"
          put_object release-files/latest-linux.yml app/latest-linux.yml "text/yaml; charset=utf-8" "no-cache"
          printf '{"app_version":"%s","streamlib_version":"%s","app_commit":"%s"}\n' "$APP_VERSION" "$STREAMLIB_VERSION" "$GITHUB_SHA" > tato-studio-release.json
          put_object tato-studio-release.json app/tato-studio-release.json "application/json" "no-cache"

      - name: get.tatolab.com serves this release
        run: |
          set -euo pipefail
          for update_file in "Tato-Studio-$APP_VERSION-arm64-mac.zip" "Tato-Studio-$APP_VERSION-x86_64.AppImage"; do
            served_sha256="$(curl -fsSL "$GET_TATOLAB_COM_URL/app/releases/$APP_VERSION/$update_file" | sha256sum | cut -d ' ' -f 1)"
            built_sha256="$(sha256sum "release-files/$update_file" | cut -d ' ' -f 1)"
            [ "$served_sha256" = "$built_sha256" ] || { echo "::error::get.tatolab.com serves a $update_file that is not the one built"; exit 1; }
          done
          curl -fsSL -H "Cache-Control: no-cache" "$GET_TATOLAB_COM_URL/app/latest-mac.yml" | grep -qx "version: $APP_VERSION" \
            || { echo "::error::get.tatolab.com/app/latest-mac.yml does not name $APP_VERSION"; exit 1; }

      - name: Attach the release's files to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "v$APP_VERSION" --target "$GITHUB_SHA" --title "Tato Studio $APP_VERSION"
          --notes "Tato Studio $APP_VERSION, bundling the Tatolab runtime $STREAMLIB_VERSION."
          "release-files/Tato-Studio-$APP_VERSION-arm64.dmg"
          "release-files/Tato-Studio-$APP_VERSION-amd64.deb"
          "release-files/Tato-Studio-$APP_VERSION-x86_64.AppImage"
