name: Feature
description: A change to the app — the window, the tray, setup, uninstall, the platform layer, or packaging.
title: "feat: "
body:
  - type: textarea
    id: what-and-why
    attributes:
      label: What & why
      description: "2–5 plain-language sentences: what a person can now do or see, and what it buys — written for a 30-second read."
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design
      description: "what the app reads from the runtime's local API, what it shows, and on which platform; the app's architecture is decided in tatolab/streamlib's docs/plan/, never in the ticket — link the plan entry or change it implements"
    validations:
      required: false
  - type: textarea
    id: done-means
    attributes:
      label: Done means
      description: "2–4 outcome criteria a person could check in the running app"
    validations:
      required: true
  - type: textarea
    id: validation-shape
    attributes:
      label: Validation shape
      description: "the shape of the proof — hermetic tests (fake local API, injected prompts and clocks), and the /verify-app evidence: live, Linux container, or mock preset; not exact test names"
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: macOS
        - label: Linux
  - type: textarea
    id: waits-on
    attributes:
      label: Waits on
      description: "the tatolab/streamlib issues or releases that give the runtime what this needs; the app never works around a missing runtime capability"
      value: "None"
    validations:
      required: false
  - type: textarea
    id: non-derivable-notes
    attributes:
      label: Non-derivable notes
      description: "hidden invariants or ruled-out approaches WITH the why; never implementation mechanics"
      value: "None"
    validations:
      required: false
